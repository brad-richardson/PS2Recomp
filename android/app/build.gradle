plugins {
    id 'com.android.application'
}

// Override with: gradlew assembleRelease -Pps2xBootElf=/absolute/path/on/device.elf
def ps2xBootElf = project.findProperty('ps2xBootElf') ?: '/storage/emulated/0/Android/data/com.ps2x.runner/files/game.elf'
def ps2xGameCodegenDir = project.findProperty('ps2xGameCodegenDir') ?: ''
def ps2xGsShadowParallel = project.findProperty('ps2xGsShadowParallel') ?: 'OFF'
def ps2xParallelGsSourceDir = project.findProperty('ps2xParallelGsSourceDir') ?: ''
def ps2xJniLibsDir = project.findProperty('ps2xJniLibsDir') ?: ''
// VR1: generated VU1 images (vu1_<hash>.cpp); empty = interpreter only.
def ps2xVu1RecompDir = project.findProperty('ps2xVu1RecompDir') ?: ''
// VR3: generated VU0 images (vu0_<hash>.cpp); used only with PS2X_VU0_RECOMP=1 at run time.
def ps2xVu0RecompDir = project.findProperty('ps2xVu0RecompDir') ?: ''
// VR4 D1: vector FMAC core (CMake PS2X_VU1_FMAC_SIMD), ON/OFF (default ON).
def ps2xVu1FmacSimd = project.findProperty('ps2xVu1FmacSimd') ?: 'ON'
// VP2: VU1 engine hand-off/unit-time counters (CMake PS2X_VU1_ENGINE_STATS), diagnostic, default OFF.
def ps2xVu1EngineStats = project.findProperty('ps2xVu1EngineStats') ?: 'OFF'

android {
    namespace 'com.ps2x.runner'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.ps2x.runner'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                arguments '-DPS2X_BUILD_RECOMP=OFF',
                        '-DPS2X_BUILD_ANALYZER=OFF',
                        '-DPS2X_BUILD_TEST=OFF',
                        '-DPS2X_BUILD_STUDIO=OFF',
                        '-DPS2X_ENABLE_SCCACHE=OFF',
                        '-DPS2X_RUNNER_UNITY_BUILD_BATCH_SIZE=32',
                        '-DANDROID_CPP_FEATURES=rtti exceptions',
                        '-DPS2X_ENABLE_DIAG_TAPS=OFF',
                        '-DPS2X_ENABLE_RUNTIME_LOGS=OFF',
                        '-DPS2X_ENABLE_AGRESSIVE_LOGS=OFF',
                        '-DPS2X_ENABLE_IOP_RPC_TRACE=OFF',
                        '-DPS2X_ENABLE_DEBUG_UI=OFF',
                        "-DPS2X_DEFAULT_BOOT_ELF=${ps2xBootElf}",
                        "-DPS2X_GAME_CODEGEN_DIR=${ps2xGameCodegenDir}",
                        "-DPS2X_GS_SHADOW_PARALLEL=${ps2xGsShadowParallel}",
                        "-DPS2X_PARALLEL_GS_SOURCE_DIR=${ps2xParallelGsSourceDir}",
                        "-DPS2X_VU1_RECOMP_DIR=${ps2xVu1RecompDir}",
                        "-DPS2X_VU0_RECOMP_DIR=${ps2xVu0RecompDir}",
                        "-DPS2X_VU1_FMAC_SIMD=${ps2xVu1FmacSimd}",
                        "-DPS2X_VU1_ENGINE_STATS=${ps2xVu1EngineStats}",
                        '-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O3 -g -DNDEBUG',
                        '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O3 -g -DNDEBUG'
                targets 'ps2EntryRunner'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    if (ps2xJniLibsDir) {
        sourceSets.main.jniLibs.srcDirs = [ps2xJniLibsDir]
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

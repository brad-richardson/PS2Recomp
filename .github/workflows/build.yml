name: build

# This fork supports macOS Apple silicon and Linux (x86_64/arm64, including
# WSL2 and containers) through the public builder in tools/ssx3. The
# inherited x86_64-gcc / x86_64-clang / MSVC full-project matrix was never
# green here (arm_neon.h on x86_64, an archiver failure under clang, M_PI
# under MSVC) and covers configurations the fork does not exercise, so it
# is replaced by the three jobs below, which mirror the fork's validated
# paths: the Mac suite is the gate of record, the Python checks cover the
# trust boundary, and the pin check exercises the public-clone path.
# Windows users run the Linux path inside WSL2 Ubuntu. There is deliberately
# no Linux native-suite job yet: Ubuntu GCC + project IPO emits slim LTO
# objects whose weak explicit-instantiation symbols the archive link drops
# (undefined VuCore::execLower at link; see day-fix-1 REPORT). That
# pre-existing toolchain issue needs its own lane; until then Linux suite
# validation stays container-manual, and this badge stays honest.
on: [push, pull_request]

jobs:
  generator-pin:
    name: generator-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pinned generator is fetchable from the public fork
        shell: bash
        run: |
          set -euo pipefail
          pin="$(python3 -c 'import sys; sys.path.insert(0, "tools/ssx3"); import build; print(build.GENERATOR)')"
          fork="$(python3 -c 'import sys; sys.path.insert(0, "tools/ssx3"); import build; print(build.FORK)')"
          rm -rf /tmp/generator-pin-check
          git init /tmp/generator-pin-check
          git -C /tmp/generator-pin-check fetch --depth=1 "$fork" "$pin"
          git -C /tmp/generator-pin-check cat-file -e "$pin^{commit}"

  python-checks:
    name: python-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the product module (post-split home of games/ssx3/module)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: brad-richardson/ssx3-120
          ref: main
          path: ssx3-120
          persist-credentials: false
          fetch-depth: 1
          # Public repo: the default github.token reads it; no secret needed.
          token: ${{ github.token }}

      - name: Builder trust-boundary tests (stdlib plus numpy/Pillow)
        shell: bash
        env:
          SSX3_MODULE_DIR: ${{ github.workspace }}/ssx3-120/games/ssx3/module
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pil
          python3 tools/ssx3/test_prebuilt.py
          for t in tools/ssx3/tests/test_*.py; do python3 "$t"; done

  mac-suite:
    name: mac-suite
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja llvm python pkg-config autoconf automake libtool bison sdl3 libpng jpeg-turbo zstd lz4 webp freetype ffmpeg

      - name: Check out the product module (post-split home of games/ssx3/module)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: brad-richardson/ssx3-120
          ref: main
          path: ssx3-120
          persist-credentials: false
          fetch-depth: 1
          # Public repo: the default github.token reads it; no secret needed.
          token: ${{ github.token }}

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_BUILD_STUDIO=OFF -DPS2X_ENABLE_SCCACHE=OFF \
            -DPS2X_GAME_MODULE_DIR="$GITHUB_WORKSPACE/ssx3-120/games/ssx3/module"

      - name: Build suite
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target ps2x_tests --parallel 4

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          ./build/ps2xTest/ps2x_tests



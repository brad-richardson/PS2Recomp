name: build

# This fork supports macOS Apple silicon and Linux (x86_64/arm64, including
# WSL2 and containers) through the public builder in tools/ssx3. The
# inherited x86_64-gcc / x86_64-clang / MSVC full-project matrix was never
# green here (arm_neon.h on x86_64, an archiver failure under clang, M_PI
# under MSVC) and covers configurations the fork does not exercise, so it
# is replaced by the four jobs below, which mirror the fork's real gates:
# the Mac suite is the gate of record, Linux arm64 is the validated
# container path, the Python checks cover the trust boundary, and the pin
# check exercises the public-clone path. Windows users run the Linux path
# inside WSL2 Ubuntu.
on: [push, pull_request]

jobs:
  generator-pin:
    name: generator-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pinned generator is fetchable from the public fork
        shell: bash
        run: |
          set -euo pipefail
          pin="$(python3 -c 'import sys; sys.path.insert(0, "tools/ssx3"); import build; print(build.GENERATOR)')"
          fork="$(python3 -c 'import sys; sys.path.insert(0, "tools/ssx3"); import build; print(build.FORK)')"
          rm -rf /tmp/generator-pin-check
          git init /tmp/generator-pin-check
          git -C /tmp/generator-pin-check fetch --depth=1 "$fork" "$pin"
          git -C /tmp/generator-pin-check cat-file -e "$pin^{commit}"

  python-checks:
    name: python-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Builder trust-boundary tests (stdlib plus numpy/Pillow)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pil
          python3 tools/ssx3/test_prebuilt.py
          for t in tools/ssx3/tests/test_*.py; do python3 "$t"; done

  mac-suite:
    name: mac-suite
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja llvm python pkg-config autoconf automake libtool bison sdl3 libpng jpeg-turbo zstd lz4 webp freetype

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_BUILD_STUDIO=OFF -DPS2X_ENABLE_SCCACHE=OFF

      - name: Build suite
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target ps2x_tests --parallel 4

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          ./build/ps2xTest/ps2x_tests

  linux-arm64-suite:
    name: linux-arm64-suite
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git ca-certificates ninja-build cmake pkg-config gcc g++ libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          # IPO emits slim LTO objects: plain ar writes an archive index the
          # linker cannot resolve (undefined refs at link). gcc-ar/gcc-ranlib
          # understand slim objects and are drop-in otherwise.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_BUILD_STUDIO=OFF -DPS2X_ENABLE_SCCACHE=OFF \
            "-DCMAKE_AR=$(command -v gcc-ar)" "-DCMAKE_RANLIB=$(command -v gcc-ranlib)"

      - name: Build suite
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target ps2x_tests --parallel 4

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          ./build/ps2xTest/ps2x_tests
